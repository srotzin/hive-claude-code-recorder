[package]
name = "hive-shared-key"
version = "2.0.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "Three-party shared signing key for the Hive witness log (FROST Ed25519, RFC 9591), with the signing rules each party enforces"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
frost-ed25519 = { version = "=3.0.0", default-features = false, features = ["serialization", "serde"] }
frost-core = { version = "=3.0.0", default-features = false, features = ["serialization", "serde", "internals"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["custom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
